using KarateClubManagement.Business.Models;
using QuestPDF.Fluent;
using QuestPDF.Helpers;

namespace KarateClubManagement.Web;

public static class ReceiptPdfGenerator
{
    public static byte[] Generate(Payment payment)
    {
        var document = Document.Create(container =>
        {
            container.Page(page =>
            {
                page.Margin(40);
                page.Size(PageSizes.A4);
                page.Header().Text("Reçu de paiement - Club de Karaté").FontSize(24).Bold();
                page.Content().Column(column =>
                {
                    column.Spacing(10);
                    column.Item().Text($"Membre : {payment.Member.FirstName} {payment.Member.LastName}");
                    column.Item().Text($"Email : {payment.Member.Email}");
                    column.Item().Text($"Type : {payment.FeeType}");
                    column.Item().Text($"Montant : {payment.Amount:F2} €");
                    column.Item().Text($"Date d'échéance : {payment.DueDate:dd/MM/yyyy}");
                    column.Item().Text($"Date de paiement : {payment.PaidDate?.ToString("dd/MM/yyyy") ?? "-"}");
                    column.Item().Text($"Référence : {payment.ReceiptNumber}");
                });
                page.Footer().AlignCenter().Text("Merci pour votre confiance.");
            });
        });

        return document.GeneratePdf();
    }
}
